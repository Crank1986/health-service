apiVersion: v1
kind: ConfigMap
metadata:
  name: users-migrations
  namespace: hs
data:
  001_create_users.sql: |-
    CREATE TABLE users (
        id SERIAL PRIMARY KEY,
        name VARCHAR(200) NOT NULL,
        email VARCHAR(200) NOT NULL UNIQUE
    );
  002_add_password_hash.sql: |-
    ALTER TABLE users
      ADD COLUMN password_hash TEXT;