apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
  labels:
    app: health-service
  namespace: hs
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  selector:
    matchLabels:
      env: health-service-env
  template:
    metadata:
      labels:
        env: health-service-env
    spec:
      containers:
      - name: health-app
        image: artemprotchenko/myapp:users-update-v1
        envFrom:
          - configMapRef:
              name: users-app-config
        env:
          - name: DB_USER
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: CUSTOM_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: CUSTOM_PASSWORD
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
