apiVersion: batch/v1
kind: Job
metadata:
  name: users-migration-001
  namespace: hs
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: postgres:18.6
          volumeMounts:
            - name: migration-sql
              mountPath: /migrations
              readOnly: true
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: CUSTOM_PASSWORD
          command: ["psql"]
          args:
            - "-h"
            - "users-db-postgres"
            - "-U"
            - "user_app"
            - "-d"
            - "users_db"
            - "-w"
            - "-v"
            - "ON_ERROR_STOP=1"
            - "-f"
            - "/migrations/001_create_users.sql"
      volumes:
        - name: migration-sql
          configMap:
            name: users-migrations