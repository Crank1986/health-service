apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
      Flush           5
      Log_Level       info
      Parsers_File      /fluent-bit/etc/parsers.conf

    [INPUT]
      Name                tail
      Path                /var/log/containers/*_hs_*.log
      Tag                 kube.*
      multiline.parser    docker, cri
      DB                  /var/lib/fluent-bit/tail.db
      Read_from_Head      On
      Mem_Buf_Limit       10MB
      Skip_Long_Lines     On

    [FILTER]
      Name                parser
      Match               kube.*
      Key_Name            log
      Parser              app_json
      Reserve_Data        On
      Preserve_Key        On

    [FILTER]
      Name                kubernetes
      Match               kube.*
      Kube_URL            https://kubernetes.default.svc:443
      Kube_Tag_Prefix     kube.var.log.containers.
      Merge_Log           Off
      Labels              On
      Annotations         Off

    [OUTPUT]
      Name                es
      Match               kube.*
      Host                elasticsearch
      Port                9200
      Logstash_Format     On
      Logstash_Prefix     fluent-bit-logs
      Time_Key            @timestamp
      Suppress_Type_Name  On
      Generate_ID         On
      Retry_Limit         False
  parsers.conf: |
    [PARSER]
      Name      app_json
      Format    json